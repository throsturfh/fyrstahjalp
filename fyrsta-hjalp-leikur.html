<title>Fyrsta hjálp – leikur</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14181d;color:#e8ecef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{touch-action:manipulation}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{padding:10px 14px 6px}header h1{font-size:19px;margin:0}header .sub{font-size:14px;color:#9aa7b3}
.hud{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:4px}.hud b{color:#ffd54f}
main{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch}
.sheet{background:#1d242b;border-top:1px solid #33414d;border-radius:18px 18px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));max-height:42dvh;overflow-y:auto;box-shadow:0 -6px 20px #0008}
.sheet h3{font-size:15px;margin:8px 0 4px;color:#9fb3c8}
button{font:inherit;font-size:16px;min-height:48px;border-radius:12px;border:1px solid #3a4652;background:#24303a;color:#e8ecef;padding:10px 14px;margin:4px 0;width:100%;text-align:left;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){background:#34485a}button:disabled{opacity:.5}button.primary{background:#c8102e;border-color:#c8102e;text-align:center;font-weight:600}
button.done{border-color:#4caf50}button .m{color:#9aa7b3;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.tabs button{width:auto;flex:0 0 auto;text-align:center;font-size:15px;padding:8px 12px}.tabs button.on{background:#2f6fa8;border-color:#2f6fa8}
.scene{position:relative;margin:0 auto;border-radius:14px;overflow:hidden}
.scene.wide{width:100%}.scene.wide img{width:100%;height:auto;display:block}.sheet.compact{max-height:44dvh}
.banner{padding:0 12px 6px}.scene.close img{width:100%;height:20dvh;object-fit:cover;object-position:50% 45%;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;min-height:48px;margin:0;padding:0;border-radius:50%;background:rgba(255,200,0,.9);border:3px solid #fff;color:#000;font-weight:800;text-align:center;font-size:17px;animation:p 1.6s infinite}
.hot.seen{background:rgba(120,200,120,.9);animation:none}@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,200,0,.7)}70%{box-shadow:0 0 0 14px rgba(255,200,0,0)}}
main.wideMain{padding-top:4px}
.clue{background:#232c35;border-radius:10px;padding:10px;font-size:15px;margin:4px 0}
.log p{margin:6px 0;padding:8px 10px;background:#232c35;border-radius:8px;font-size:15px}.log p.bad{border-left:4px solid #e53935}.log p.good{border-left:4px solid #4caf50}
.card{background:#1d242b;border:1px solid #2c3742;border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:17px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #2c3742;padding:8px 4px;text-align:left;vertical-align:top;font-size:15px}
.step{border-bottom:1px solid #2c3742;padding:8px 0}.step .r{color:#9aa7b3;font-size:14px}
.ok{color:#81c784}.no{color:#e57373}.score{font-size:44px;font-weight:800}.muted{color:#9aa7b3;font-size:14px}

"L": "Köld viðkomu, ekki mælt nákvæmlega", "H": "Föl, köld, rök húð", "shiver": "Mikill skjálfti", "talk": "„Mér… mér er svo kalt. Ég vil bara hvíla mig aðeins.“ (talar hægt, tennurnar glamra)"}, {"min": 32.0, "VASE": "V – sljó, ruglar saman tíma og stað", "P": "96/mín, reglulegur", "O": "18/mín", "BTH": "Púls finnst í úlnlið", "L": "Mjög köld viðkomu", "H": "Föl, köld, blámi á vörum", "shiver": "Skjálfti, klaufskar hreyfingar", "talk": "„Hvar… erum við? Ég er svo þreytt.“ (sljó, óskýrt tal)"}, {"min": 0, "VASE": "Á – opnar augu við ávarp, svarar óskiljanlega", "P": "52/mín, veikur, óreglulegur", "O": "8/mín, grunn", "BTH": "Púls finnst varla í úlnlið", "L": "Ísköld viðkomu", "H": "Grá-föl, ísköld húð", "shiver": "Enginn skjálfti", "talk": "Svarar með óskiljanlegu muldri, opnar augun aðeins við ávarp."}], "distance": {"hotspots": [{"id": "vedur", "x": 50, "y": 12, "label": "Veður", "text": "Dökk ský, slydda og strekkingsvindur (vindkæling). Það mun kólna enn meira. Vindur er óvinurinn – streymi eykur hitatap."}, {"id": "hraun", "x": 45, "y": 72, "label": "Landslag", "text": "Úfið hraun með djúpri sprungu og hálum mosa beint fram undan. Göngustígurinn liggur í sveig að klettinum – lengri en öruggari leið."}, {"id": "felagi", "x": 38, "y": 38, "label": "Félagi", "text": "Göngufélagi í rauðum jakka veifar: „Hjálp! Sigga er orðin svo köld, hún lagðist bara niður!“ Hann virðist ómeiddur. Hann er auka hendur og vitni um atvikið."}, {"id": "sjuklingur", "x": 55, "y": 47, "label": "Sjúklingur", "text": "Ein manneskja liggur hreyfingarlítil í hnipri beint á blautu hrauninu við klett. Engin augljós blæðing eða slys að sjá. Bakpoki við hlið."}, {"id": "bill", "x": 19, "y": 31, "label": "Vegur og bíll", "text": "Malarvegur og bíll u.þ.b. 1 km í burtu – mögulegt skjól og flutningsleið. Sjúkrabíll kemst ekki alla leið að klettinum."}], "callOptions": [{"id": "sjukrabill", "label": "Sjúkrabíll"}, {"id": "bjorgunarsveit", "label": "Björgunarsveit"}, {"id": "logregla", "label": "Lögregla"}], "approach": [{"id": "beint", "label": "Hlaupa beint yfir hraunið", "minutes": 2, "score": -10, "flag": "fell", "text": "Þú misstígur þig í sprungu og snýrð upp á ökklann. Þú kemst að sjúklingnum en haltrar – nú eru tveir í hættu. Vettvangur: þitt öryggi fyrst!"}, {"id": "stigur", "label": "Nálgast varlega eftir stígnum", "minutes": 3, "score": 10, "flag": "safeApproach", "text": "Þú ferð stíginn í sveig og kemst örugglega að klettinum. Rétt: tryggja eigið öryggi áður en farið er að sjúklingi."}, {"id": "bida", "label": "Bíða og fylgjast með úr fjarlægð", "minutes": 6, "score": -15, "flag": "waited", "text": "Þú bíður í 6 mínútur. Veðrið versnar og sjúklingurinn kólnar á meðan. Vettvangurinn var ekki hættulegur – að bíða hjálpaði engum. Að lokum ferðu af stað eftir stígnum."}]}, "close": {"groups": [{"id": "vettvangur", "label": "1. Vettvangur kannaður"}, {"id": "frumskodun", "label": "2. Frumskoðun"}, {"id": "saga", "label": "3. Sjúkrasaga og líkamsskoðun"}, {"id": "medferd", "label": "Meðferð"}], "actions": [{"id": "hanskar", "group": "vettvangur", "label": "Hanskar og eigið öryggi", "minutes": 0, "flag": "gloves", "text": "Þú setur á þig hanska og athugar að þú standir stöðugt. Félaginn fær að halda á bakpokanum."}, {"id": "atvik", "group": "vettvangur", "label": "Spyrja félagann hvað gerðist", "minutes": 1, "flag": "askedPartner", "text": "„Við lögðum af stað kl. 10, villtumst aðeins. Hún datt í læk fyrir tveimur tímum og er blaut. Ekkert högg. Hún er búin að vera skjálfandi lengi og lagðist bara niður.“"}, {"id": "tala", "group": "frumskodun", "label": "Tala við sjúkling", "minutes": 1, "flag": "talked", "text": "Þú kynnir þig: „Ég heiti … og kann fyrstu hjálp, má ég hjálpa þér?“ Sigga: {talk}"}, {"id": "vase", "group": "frumskodun", "label": "Meta meðvitund (VÁSE)", "minutes": 1, "flag": "vase", "text": "VÁSE: {VASE}."}, {"id": "ondun", "group": "frumskodun", "label": "Öndunarvegur og öndun", "minutes": 1, "flag": "breathing", "text": "Öndunarvegur op
